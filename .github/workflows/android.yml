name: Android CI

on:
  push:
    branches: [ "master", "dev" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/**"
      - "fastlane/**"
      - ".gitignore"
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [ "master", "dev" ]
    paths-ignore:
      - ".idea/**"
      - "fastlane/**"
      - ".gitignore"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --build-cache --parallel --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
